name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install ".[api,pdf,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Retrieval eval (offline)
        run: |
          python -m sanad eval --out eval/results.md
          cat eval/results.md >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sanad .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name sanad sanad
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/api/ask -H 'Content-Type: application/json' \
            -d '{"question": "ما هي النسبة القصوى لعبء الدين؟"}' | tee /dev/stderr | grep -q DCFR-2026
