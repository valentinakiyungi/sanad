<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f3f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)">
<title>Sanad · سند</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f3f0; --panel: #ffffff; --ink: #151515; --muted: #6f6c66; --line: #e4e2dc;
    --accent: #f2a516; --accent-ink: #151515; --accent-soft: #fdf0d3; --link: #9a5800;
    --bubble: #151515; --bubble-ink: #ffffff;
    --graph: #151515; --graph-soft: #f2a516; --warn: #b42318; --warn-soft: #fdecea;
    --radius: 14px; --composer-h: 76px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0c0c; --panel: #171717; --ink: #f2f0eb; --muted: #9c9890; --line: #2a2a2a;
      --accent: #f5b335; --accent-ink: #111111; --accent-soft: #3a2c0e; --link: #f5b335;
      --bubble: #f5b335; --bubble-ink: #111111;
      --graph: #111111; --graph-soft: #f5b335; --warn: #ff8a80; --warn-soft: #3a1714; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink);
    font: 16px/1.6 "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, sans-serif; }
  :lang(ar), [dir="rtl"] { font-family: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif; }

  /* Header */
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; }
  .bar { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; }
  .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font: 600 16px "IBM Plex Sans Arabic"; }
  .brand small { font: 500 16px "IBM Plex Sans Arabic"; color: var(--link); }

  /* Thread */
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px calc(var(--composer-h) + env(safe-area-inset-bottom) + 32px); }
  .empty { min-height: calc(100dvh - 220px); display: grid; place-items: center; text-align: center; }
  .empty .mark { width: 64px; height: 64px; border-radius: 20px; font-size: 32px; margin: 0 auto; box-shadow: 0 10px 30px -10px var(--accent); }
  .turn { margin-bottom: 28px; animation: rise .25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .q { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  .q div { max-width: 85%; background: var(--bubble); color: var(--bubble-ink); padding: 10px 14px;
    border-radius: var(--radius); border-end-end-radius: 4px; unicode-bidi: plaintext; overflow-wrap: anywhere; }
  .a { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; overflow-wrap: anywhere; }
  .a.abstain { background: var(--warn-soft); border-color: transparent; }
  .a .text { font-size: 16.5px; unicode-bidi: plaintext; }
  .a sup { color: var(--link); font-weight: 600; font-size: 11px; margin-inline-start: 1px; }
  .a.error .text { color: var(--warn); }

  details.group { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  details.group > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted); font-weight: 500; min-height: 32px; user-select: none; }
  details.group > summary::-webkit-details-marker, .src summary::-webkit-details-marker { display: none; }
  details.group > summary::before { content: ""; width: 7px; height: 7px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0;
    transform: rotate(-45deg); transition: transform .15s; margin-inline-end: 4px; }
  [dir="rtl"] details.group > summary::before { transform: rotate(135deg); }
  details.group[open] > summary::before { transform: rotate(45deg); }

  .src { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 8px; background: var(--bg); }
  .src summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
  .src strong { font-weight: 500; font-size: 14px; unicode-bidi: plaintext; flex: 1 1 200px; min-width: 0; }
  .none { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
  .src p { margin: 8px 0 0; color: var(--muted); font-size: 14.5px; white-space: pre-line; unicode-bidi: plaintext; }
  .marker { font: 12px "IBM Plex Mono", monospace; background: var(--line); color: var(--muted); padding: 1px 7px; border-radius: 6px; }


  .dots { display: inline-flex; gap: 5px; padding: 6px 0; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite both; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* Composer */
  .composer { position: fixed; inset-inline: 0; bottom: 0; z-index: 5;
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    padding: 16px 16px calc(env(safe-area-inset-bottom) + 14px); }
  form { max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 6px 6px 6px 16px;
    box-shadow: 0 8px 28px -14px rgb(0 0 0 / .35); transition: border-color .15s; }
  form:focus-within { border-color: var(--accent); }
  textarea { flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--ink);
    font: inherit; font-size: 16px; /* 16px stops iOS zooming on focus */
    line-height: 1.5; padding: 8px 0; max-height: 160px; min-height: 40px; unicode-bidi: plaintext; }
  textarea::placeholder { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .send { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; cursor: pointer; transition: opacity .15s, transform .1s; }
  .send:active { transform: scale(.94); }
  .send:disabled { opacity: .35; cursor: default; }
  .send svg { width: 18px; height: 18px; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  textarea:focus-visible { outline: none; } /* the whole bar highlights instead */
  @media (min-width: 640px) { main { padding-top: 28px; } .a { padding: 18px 22px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span class="mark">س</span>Sanad <small>سند</small></div>
  </div>
</header>

<main id="thread">
  <div class="empty" id="empty"><span class="mark">س</span></div>
</main>

<div class="composer">
  <form id="f">
    <textarea id="q" rows="1" dir="auto" enterkeyhint="send" aria-label="Question"
      placeholder="Ask a question · اسأل سؤالاً"></textarea>
    <button class="send" id="go" type="submit" aria-label="Send" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const isAr = (s) => (s.match(/[؀-ۿ]/g) || []).length > (s.match(/[A-Za-z]/g) || []).length;
const L = (ar) => ar
  ? { sources: "المصادر", none: "لم يتم العثور على مصادر." }
  : { sources: "Sources", none: "No sources retrieved." };

const q = $("q"), go = $("go");
let busy = false;

function resize() { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 160) + "px"; }
function sync() { go.disabled = busy || !q.value.trim(); }
q.addEventListener("input", () => { resize(); sync(); });
q.addEventListener("keydown", (e) => {
  // Enter sends on desktop; on touch keyboards Enter inserts a newline and the button sends.
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && matchMedia("(hover: hover)").matches) { e.preventDefault(); ask(); }
});
$("f").addEventListener("submit", (e) => { e.preventDefault(); ask(); });

function scrollToEnd() { window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }); }

async function ask() {
  const question = q.value.trim();
  if (!question || busy) return;
  busy = true; sync();
  $("empty")?.remove();

  const ar = isAr(question);
  const turn = document.createElement("section");
  turn.className = "turn"; turn.dir = ar ? "rtl" : "ltr"; turn.lang = ar ? "ar" : "en";
  turn.innerHTML = `<div class="q"><div>${esc(question)}</div></div>
    <div class="a"><div class="dots" aria-label="Loading"><i></i><i></i><i></i></div></div>`;
  $("thread").append(turn);
  q.value = ""; resize(); scrollToEnd();

  const box = turn.querySelector(".a");
  try {
    const res = await fetch("api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : `Error ${res.status}`);
    render(box, data, ar);
  } catch (err) {
    box.classList.add("error");
    box.innerHTML = `<div class="text">${esc(err.message || "Network error")}</div>`;
  } finally {
    busy = false; sync();
    if (matchMedia("(hover: hover)").matches) q.focus();
    turn.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

function render(box, d, ar) {
  const t = L(ar);
  const cited = new Set(d.citations.map((c) => c.marker));
  box.classList.toggle("abstain", d.abstained);
  const sources = d.sources.map((s) => `
    <details class="src" ${cited.has(s.marker) ? "open" : ""}>
      <summary><span class="marker">${s.marker}</span><strong dir="auto">${esc(s.label)} — ${esc(s.title)}</strong></summary>
      <p dir="auto">${esc(s.text)}</p>
    </details>`).join("");
  const answer = `<div class="text" dir="auto">${esc(d.answer).replace(/\[(S\d+)\]/g, "<sup>[$1]</sup>")}</div>`;
  // No answer means the sources weren't used, so don't show them.
  box.innerHTML = d.abstained ? answer : `${answer}
    <details class="group" ${matchMedia("(min-width: 640px)").matches ? "open" : ""}><summary>${t.sources} · ${d.sources.length}</summary>
      ${sources || `<p class="none">${t.none}</p>`}</details>`;
}
</script>
</body>
</html>
