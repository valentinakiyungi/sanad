[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanad"
version = "0.1.0"
description = "Bilingual Arabic-English GraphRAG over regulations, with citations and evals"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Valentina Yuda Kiyungi" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "networkx>=3.2"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "langgraph>=0.2"]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
sanad = "sanad.cli:main"

[tool.setuptools.packages.find]
include = ["sanad*"]

[tool.setuptools.package-data]
sanad = ["static/*"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
